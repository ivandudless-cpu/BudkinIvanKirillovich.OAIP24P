<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ movie.title }}</title>
</head>
<body>

<h1>{{ movie.title }}</h1>

<p>Год выпуска: {{ movie.year }}</p>
<p>Рейтинг: {{ movie.rating }}</p>
<p>Жанр: {{ movie.genre }}</p>
<p>Описание: {{ movie.description }}</p>

{% if movie.rating == 8.9 %}
<p>ОЧЕНЬ РЕКОМЕНДУЕМ К ПРОСМОТРУ!!!</p>
{% elif movie.rating >= 8.5 %}
<p>Рекомендуем посмотреть!</p>
{% endif %}

<a href="/">Назад</a>

</body>
</html>
