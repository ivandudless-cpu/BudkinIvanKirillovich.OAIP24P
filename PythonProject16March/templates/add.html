<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <h1>Добавление нового материала</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div style="color: {% if category == 'success' %}green{% else %}red{% endif %};">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <p>
                <label>Название: </label><br>
                <input type="text" name="title" required>
            </p>
            <p>
                <label>Категория: </label><br>
                <input type="text" name="category" required>
            </p>
            <p>
                <label>Автор: </label><br>
                <input type="text" name="author" required>
            </p>
            <p>
                <label>Описание: </label><br>
                <input type="text" name="description" rows="S" cols="40" required>
            </p>
            <p>
                <input type="submit" value="Добавить материал">
            </p>
        </form>

        <p>
            <a href="{{ url_for('mater') }}">Назад к списку материалов</a>
            <a href="{{ url_for('index') }}">На главную</a>
        </p>
</body>
</html>
