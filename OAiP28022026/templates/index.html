<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Среднее число</title>
</head>
<body>
<h1>Среднее число:</h1>
    {% if (a >= b and a <= c) or (a >= c and a <= b) %}
        {{ a }}
    {% elif (b >= a and b <= c) or (b >= c and b <= a) %}
        {{ b }}
    {% else %}
        {{ c }}
    {% endif %}
</body>
</html>
